
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天氣百科 Weather Encyclopedia</title>
<style>
:root {
  --navy: #174a75;
  --blue: #397eb5;
  --light-blue: #e8f3fc;
  --pale: #f4f8fc;
  --text: #263b50;
  --muted: #71849a;
  --white: #fff;
  --border: #dce7f0;
  --shadow: 0 8px 28px rgba(30,75,110,.09);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background: var(--pale);
  color: var(--text);
  line-height: 1.8;
}

button { font: inherit; cursor: pointer; }

header {
  height: 70px;
  padding: 0 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: white;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 20;
}

.logo {
  color: var(--navy);
  font-size: 21px;
  font-weight: 800;
  cursor: pointer;
}

.logo span { color: var(--blue); }

nav { display: flex; gap: 28px; }

nav button {
  border: 0;
  background: none;
  color: var(--text);
  font-weight: 600;
}

nav button:hover { color: var(--blue); }

main { min-height: 75vh; }

.hero {
  padding: 90px 8%;
  background:
    radial-gradient(circle at 80% 20%, #ffffffb0 0 9%, transparent 25%),
    linear-gradient(125deg, #174a75, #397eb5 60%, #a9d0ed);
  color: white;
  position: relative;
  overflow: hidden;
}

.hero::after {
  content: "☁";
  position: absolute;
  right: 9%;
  bottom: -100px;
  font-size: 320px;
  opacity: .12;
}

.hero-content {
  max-width: 1100px;
  margin: auto;
  position: relative;
  z-index: 1;
}

.hero small { letter-spacing: 3px; opacity: .8; }

.hero h1 {
  font-size: clamp(35px, 5vw, 58px);
  line-height: 1.3;
  margin: 18px 0;
}

.hero p {
  font-size: 17px;
  max-width: 600px;
  opacity: .9;
}

.primary-btn {
  background: white;
  color: var(--navy);
  border: 0;
  border-radius: 8px;
  padding: 12px 25px;
  margin-top: 20px;
  font-weight: 700;
}

.primary-btn:hover { background: var(--light-blue); }

.container {
  max-width: 1150px;
  margin: auto;
  padding: 65px 25px;
}

.section-title { margin-bottom: 28px; }

.section-title h2 {
  font-size: 27px;
  color: var(--navy);
  margin: 0;
}

.section-title p { color: var(--muted); margin: 5px 0; }

.weather-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.weather-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: .25s;
}

.weather-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow);
}

.card-art {
  height: 135px;
  display: grid;
  place-items: center;
  font-size: 64px;
  background: linear-gradient(145deg, #d9edfc, #f3f8fd);
}

.card-info { padding: 17px; }

.card-info h3 { margin: 0 0 5px; color: var(--navy); }

.card-info p { margin: 0; color: var(--muted); font-size: 13px; }

.info-panel {
  background: white;
  padding: 28px;
  border-radius: 14px;
  border: 1px solid var(--border);
  margin-top: 35px;
}

.info-panel h3 { color: var(--navy); margin-top: 0; }

.fact-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.fact {
  background: var(--light-blue);
  padding: 18px;
  border-radius: 10px;
}

.fact strong { color: var(--navy); display: block; }

footer {
  text-align: center;
  padding: 30px;
  background: #174a75;
  color: white;
  font-size: 13px;
}

/* 天氣介紹閱讀頁 */

.reader {
  max-width: 1000px;
  margin: auto;
  padding: 40px 20px 65px;
}

.back-btn {
  border: 0;
  background: none;
  color: var(--blue);
  font-weight: 700;
  margin-bottom: 20px;
}

.reader-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
}

.reader-header h1 {
  color: var(--navy);
  margin: 0;
  font-size: 34px;
}

.reader-header p { color: var(--muted); margin: 5px 0 20px; }

.chapter-menu {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 15px 0 25px;
}

.chapter-menu button {
  border: 1px solid var(--border);
  background: white;
  color: var(--muted);
  border-radius: 7px;
  padding: 8px 13px;
  font-size: 13px;
}

.chapter-menu button.active {
  background: var(--navy);
  color: white;
  border-color: var(--navy);
}

.book-page {
  background: white;
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
  min-height: 460px;
  animation: appear .3s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateX(18px); }
  to { opacity: 1; transform: translateX(0); }
}

.page-banner {
  padding: 35px 40px;
  background: linear-gradient(120deg, #e5f2fc, #f5f9fd);
}

.page-banner small { color: var(--blue); font-weight: 700; }

.page-banner h2 {
  color: var(--navy);
  font-size: 28px;
  margin: 5px 0;
}

.page-content { padding: 30px 40px; }

.page-content p { line-height: 2; }

.page-content li { margin: 8px 0; }

.weather-note {
  padding: 17px 20px;
  background: var(--light-blue);
  border-left: 4px solid var(--blue);
  border-radius: 6px;
  margin: 20px 0;
}

.timeline {
  border-left: 3px solid #a9d0ed;
  padding-left: 25px;
  margin: 25px 0;
}

.timeline-item {
  position: relative;
  margin-bottom: 23px;
}

.timeline-item::before {
  content: "";
  position: absolute;
  left: -33px;
  top: 8px;
  width: 13px;
  height: 13px;
  background: var(--blue);
  border-radius: 50%;
}

.timeline-item strong { color: var(--navy); }

.reader-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 25px;
  gap: 15px;
}

.reader-controls button {
  border: 1px solid var(--border);
  background: white;
  padding: 11px 20px;
  border-radius: 8px;
  color: var(--navy);
  font-weight: 700;
}

.reader-controls button:hover:not(:disabled) {
  background: var(--light-blue);
}

.reader-controls button:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.page-count { color: var(--muted); font-weight: 700; }

/* 雲種圖鑑 */

.cloud-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.cloud-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 23px;
}

.cloud-icon { font-size: 40px; }

.cloud-card h3 { color: var(--navy); margin: 8px 0; }

.cloud-card p { color: var(--muted); font-size: 14px; }

.hidden { display: none !important; }

@media(max-width:800px) {
  .weather-grid { grid-template-columns: repeat(2, 1fr); }
  .cloud-grid { grid-template-columns: repeat(2, 1fr); }
  header { padding: 0 4%; }
  nav { gap: 12px; }
  nav button { font-size: 13px; }
}

@media(max-width:520px) {
  header { height: auto; padding: 14px; flex-wrap: wrap; gap: 10px; }
  nav { width: 100%; justify-content: space-between; }
  .weather-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .card-art { height: 95px; font-size: 48px; }
  .card-info { padding: 12px; }
  .card-info h3 { font-size: 16px; }
  .fact-grid, .cloud-grid { grid-template-columns: 1fr; }
  .page-content { padding: 22px; }
  .page-banner { padding: 25px; }
  .reader-header h1 { font-size: 27px; }
  .chapter-menu { gap: 5px; }
  .chapter-menu button { padding: 7px 9px; }
}
</style>
</head>

<body>

<header>
  <div class="logo" onclick="showHome()">☁ 天氣<span>百科</span></div>
  <nav>
    <button onclick="showHome()">首頁</button>
    <button onclick="showHome('weather')">天氣百科</button>
    <button onclick="showClouds()">雲種圖鑑</button>
  </nav>
</header>

<main id="app"></main>

<footer>

const chapters = [
"天氣介紹",
"發生前的氣象徵兆",
"天氣形成原因",
"天氣變化流程",
"雲種介紹",
"相關知識與注意事項"
];

const clouds = [
["卷雲","☁️","高空中常見的絲狀或羽毛狀雲，主要由冰晶組成。通常呈現白色、纖細的外觀。"],
["卷層雲","🌤️","薄而透明的雲層，常覆蓋大片天空，有時會使太陽或月亮周圍出現光環。"],

["層積雲","☁️","低空中大片排列的雲塊，常呈灰白色，雲塊之間可能留有空隙。"],
["雨層雲","🌧️","厚而廣泛的灰暗雲層，常帶來範圍較廣且持續時間較長的降雨。"],
["積雲","⛅","底部較平坦、頂部向上隆起，常見於晴朗天氣，也可能持續發展。"],
["積雨雲","⛈️","高聳且發展旺盛的雲體，頂部可能呈鐵砧狀，常伴隨雷雨及強降雨。"]
];

// ===============================
// 畫面切換
// ===============================

const app = document.getElementById("app");
let currentWeather = 0;
let currentChapter = 0;

function showHome(scrollToWeather = false) {
  app.innerHTML = `
    <section class="hero">
      <div class="hero-content">
        <small>WEATHER ENCYCLOPEDIA</small>
        <h1>探索天空的變化<br>認識每一種天氣</h1>
        <p>從雲朵、氣壓到溫度與濕度，了解不同天氣的形成原因，以及發生前可能出現的氣象徵兆。</p>
        <button class="primary-btn" onclick="document.getElementById('weather-section').scrollIntoView({behavior:'smooth'})">開始探索 →</button>
      </div>
    </section>

    <section class="container">
      <div class="section-title">
        <h2>認識天氣百科</h2>
        <p>透過簡單的科普介紹，了解大氣環境如何影響我們的生活。</p>
      </div>
      <div class="info-panel">
        <h3>天氣是如何形成的？</h3>
        天氣是大氣在特定時間與地點呈現的狀態，受到溫度、濕度、氣壓、風及水氣等因素影響。
        不同的大氣條件相互作用，便會形成晴天、降雨、雷雨等各種天氣現象。
        本網站將帶你從天氣發生前的徵兆開始，逐步了解各種天氣的形成過程。
      </div>
    </section>

    <section class="container" id="weather-section">
      <div class="section-title">
        <h2>天氣分類</h2>
        <p>選擇想了解的天氣，開始閱讀六個章節。</p>
      </div>
      <div class="weather-grid">
        ${weatherData.map((w,i)=>`
          <div class="weather-card" onclick="openWeather(${i})">
            <div class="card-art">${w.icon}</div>
            <div class="card-info">
              <h3>${w.name}</h3>
              <p>${w.desc}</p>
            </div>
          </div>
        `).join("")}
      </div>
    </section>

    <section class="container">
      <div class="section-title">
        <h2>天氣小知識</h2>
        <p>幾個值得認識的氣象觀念。</p>
      </div>
      <div class="fact-grid">
        <div class="fact"><strong>☁️ 雲是什麼？</strong>雲主要由懸浮在空氣中的微小水滴或冰晶組成。</div>
        <div class="fact"><strong>🌡️ 什麼是露點？</strong>當空氣冷卻至露點，水氣便可能開始凝結。</div>
        <div class="fact"><strong>🌬️ 風從哪裡來？</strong>氣壓差異會推動空氣移動，形成風。</div>
      </div>
    </section>

    <section class="container">
      <div class="info-panel">
        <h3>☁️ 雲種圖鑑</h3>
        <p>天空中的雲有不同的外觀與高度，部分雲種也能反映大氣的發展情況。</p>
        <button class="primary-btn" style="background:var(--navy);color:white" onclick="showClouds()">探索雲種圖鑑 →</button>
      </div>
    </section>
  `;

  if (scrollToWeather) {
    setTimeout(()=>document.getElementById("weather-section").scrollIntoView(),50);
  }
}

// ===============================
// 天氣介紹閱讀器
// ===============================

function openWeather(index) {
  currentWeather = index;
  currentChapter = 0;
  renderReader();
  window.scrollTo({top:0,behavior:"smooth"});
}

function chapterContent(w, chapter) {
  switch(chapter) {
    case 0:
      return `<p>${w.intro}</p>
        <div class="weather-note">🌤️ <strong>閱讀重點：</strong>先認識這種天氣的外觀與常見特徵，再了解背後的大氣變化。</div>`;

    case 1:
      return `<p>${w.signs}</p>
        <div class="weather-note">📌 注意：上述現象是可能出現的氣象徵兆，並不是每次天氣變化都會依照相同順序發生。</div>`;

    case 2:
      return `<p>${w.cause}</p>
        <div class="weather-note">🌡️ 氣象原理：氣壓、溫度、濕度及空氣運動會相互影響，需要搭配整體環境判斷。</div>`;

    case 3:
      return `<p>以下是此類天氣可能的發展過程：</p>
        <div class="timeline">
          ${w.steps.map((s,i)=>`
            <div class="timeline-item">
              <strong>階段 ${i+1}</strong>
              <div>${s}</div>
            </div>
          `).join("")}
        </div>
        <div class="weather-note">流程為概念性示意，不代表所有地區或每次天氣事件都會完全相同。</div>`;

    case 4:
      return `<p>${w.clouds}</p>
        <p>雲的種類可依高度及外觀分類，並非所有雲都會帶來降雨。可以前往雲種圖鑑認識更多種類。</p>
        <button class="primary-btn" style="background:var(--navy);color:white" onclick="showClouds()">前往雲種圖鑑 →</button>`;

    case 5:
      return `<p>${w.notes}</p>
        <div class="weather-note">⚠️ 氣象資訊僅供科普學習。遇到實際天氣警報或災害風險時，請以中央氣象署及政府機關發布的資訊為準。</div>`;
  }
}

function renderReader() {
  const w = weatherData[currentWeather];

  app.innerHTML = `
    <section class="reader">
      <button class="back-btn" onclick="showHome(true)">← 返回天氣分類</button>

      <div class="reader-header">
        <div>
          <h1>${w.icon} ${w.name}</h1>
          <p>${w.desc}</p>
        </div>
        <div style="color:var(--muted)">Weather Encyclopedia</div>
      </div>

      <div class="chapter-menu">
        ${chapters.map((c,i)=>`
          <button class="${i===currentChapter?'active':''}"
            onclick="goChapter(${i})">
            ${i+1}. ${c}
          </button>
        `).join("")}
      </div>

      <div class="book-page" id="book-page">
        <div class="page-banner">
          <small>CHAPTER ${currentChapter+1} / 6</small>
          <h2>${chapters[currentChapter]}</h2>
          <div style="color:var(--muted)">認識${w.name}的氣象知識與變化</div>
        </div>
        <div class="page-content">
          ${chapterContent(w,currentChapter)}
        </div>
      </div>

      <div class="reader-controls">
        <button onclick="changeChapter(-1)" ${currentChapter===0?'disabled':''}>← 上一頁</button>
        <span class="page-count">${currentChapter+1} / 6</span>
        <button onclick="changeChapter(1)" ${currentChapter===5?'disabled':''}>下一頁 →</button>
      </div>

      ${currentChapter===5?`
        <div class="info-panel" style="text-align:center">
          <h3>已完成 ${w.name} 的閱讀！</h3>
          <p>可以返回分類，繼續認識其他天氣。</p>
          <button class="primary-btn" style="background:var(--navy);color:white" onclick="showHome(true)">返回天氣分類</button>
        </div>
      `:""}
    </section>
  `;
}

function goChapter(index) {
  if(index<0 || index>5) return;
  currentChapter = index;
  renderReader();
}

function changeChapter(direction) {
  goChapter(currentChapter+direction);
}

// 支援觸控左右滑動
let touchStartX = 0;

app.addEventListener("touchstart",e=>{
  touchStartX=e.changedTouches[0].screenX;
},{passive:true});

app.addEventListener("touchend",e=>{
  if(!app.querySelector(".book-page")) return;
  const diff=e.changedTouches[0].screenX-touchStartX;
  if(Math.abs(diff)>80) {
    if(diff<0) changeChapter(1);
    else changeChapter(-1);
  }
},{passive:true});

// ===============================
// 雲種圖鑑
// ===============================

function showClouds() {
  app.innerHTML = `
    <section class="container">
      <button class="back-btn" onclick="showHome()">← 返回首頁</button>
      <div class="section-title">
        <h2>☁️ 雲種圖鑑</h2>
        <p>認識天空中不同形狀與高度的雲。</p>
      </div>

      <div class="info-panel" style="margin-bottom:25px">
        <h3>雲是如何形成的？</h3>
        當空氣中的水氣凝結成微小水滴，或水氣直接凝華形成冰晶時，便可能形成雲。
        不同高度、溫度及大氣環境，會使雲呈現不同的外觀。
      </div>

      <div class="cloud-grid">
        ${clouds.map(c=>`
          <div class="cloud-card">
            <div class="cloud-icon">${c[1]}</div>
            <h3>${c[0]}</h3>
            <p>${c[2]}</p>
          </div>
        `).join("")}
      </div>
    </section>
  `;
}

// 首頁初始化
showHome();

</script>
</body>
</html>
